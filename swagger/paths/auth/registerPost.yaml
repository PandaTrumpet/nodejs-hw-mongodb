tags:
  - User
summary: Create user
operationId: createUser
description: 'Create a user with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - name
          - email
          - password
        properties:
          name:
            description: "User's name"
            type: string
            example: 'John Doe'
          email:
            description: "User's email"
            type: string
            example: pandochca@gmail.com
          password:
            description: "User's password"
            type: string
            example: 'Hello12345'

responses:
  '201':
    description: Creates a user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully created a user!
            data:
              type: object
              $ref: '../../components/schemas/user.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
