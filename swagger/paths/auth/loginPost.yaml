tags:
  - Auth
summary: Login user
operationId: loginUser
description: 'Login a user with payload'
security:
  - bearerAuth: []
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        required:
          - email
          - password
        properties:
          email:
            description: "User's email"
            type: string
            example: pandochca@gmail.com
          password:
            description: "User's password"
            type: string
            example: 'Hello12345'
responses:
  '201':
    description: Login a user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully login a user!
            data:
              type: object
              $ref: '../../components/schemas/auth.yaml'
  '404':
    $ref: '../../components/responses/404.yaml'
