tags:
  - Auth
summary: Logout user
operationId: logoutUser
description: 'Logout a user by invalidating the current session'
security:
  - bearerAuth: []
responses:
  '200':
    description: Successfully logged out the user
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully logged out the user!
  '404':
    $ref: '../../components/responses/404.yaml'
